services:
  # MedRoute AI - Autonomous Biomedical Waste Platform (Frontend Web Service)
  - type: web
    name: medroute-ai
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_APP_TITLE
        value: MedRoute AI
      - key: VITE_SIMULATION_MODE
        value: "true"
      - key: VITE_API_URL
        value: ""
